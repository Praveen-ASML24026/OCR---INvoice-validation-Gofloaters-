[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-parser"
version = "2.0.0"
description = "GoFloaters Enterprise Invoice Parser and GST Compliance Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GoFloaters Engineering Team"}
]
dependencies = [
    "docling>=2.130.0,<=2.135.0",
    "rapidocr-onnxruntime==1.4.4",
    "pypdfium2==5.13.0",
    "opencv-python-headless>=4.8.0,<=5.0.0.93",
    "Pillow>=10.0.0,<=12.3.0",
    "numpy>=1.24.0,<=2.5.3",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
